<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CandySpark Progress</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --pink:#f6a9b6;
  --cream:#f7eddc;
  --brown:#8b4a2f;
  --green:#1f6b57;
  --text:#2f2f2f;
  --muted:#4b4b4b;

  --card:#ffffff;
  --cardShadow: 0 10px 24px rgba(0,0,0,.12);
  --radius:18px;

  --btn:#f4a261;
  --btnHover:#e76f51;

  --max: 1200px;
}

*{ box-sizing:border-box; }
html, body{ height:100%; }
body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height:100svh;
  display:flex;
  flex-direction:column;
}


.topbar{
  background: var(--pink);
  height: 78px;
  display:flex;
  align-items:center;
  position: sticky;
  top:0;
  z-index: 50;
  box-shadow: 0 2px 0 rgba(0,0,0,.05);
}
.nav-wrap{
  width: min(var(--max), calc(100% - 56px));
  margin: 0 auto;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family: "Baloo 2", cursive;
  font-weight:800;
  font-size: 28px;
  color:#fff;
  white-space:nowrap;
  user-select:none;
}
.logo{
  width: 34px;
  height: 34px;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 8px;
  display:grid;
  place-items:center;
}
.nav{
  display:flex;
  align-items:center;
  gap: 26px;
  font-family: "Baloo 2", cursive;
  font-size: 26px;
  color: rgba(255,255,255,.92);
  white-space:nowrap;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.nav a{
  color: inherit;
  text-decoration:none;
  opacity:.95;
  transition: opacity .15s ease, transform .08s ease;
}
.nav a:hover{ opacity:1; transform: translateY(-1px); }
.nav .btn-link{
  border:0;
  padding: 8px 12px;
  border-radius: 10px;
  cursor:pointer;
  font-weight:800;
  background: rgba(255,255,255,.92);
  color: #e85d75;
  font-family: "Baloo 2", cursive;
  font-size: 18px;
}


main{
  width: min(var(--max), calc(100% - 56px));
  margin: 18px auto 34px;
  flex: 1;
}


.page-title{
  font-family: "Baloo 2", cursive;
  color: var(--brown);
  font-weight: 800;
  line-height: 1;
  margin: 0 0 8px;
  font-size: clamp(34px, 3.3vw, 54px);
}
.page-subtitle{
  font-family: "Baloo 2", cursive;
  color: var(--green);
  font-weight: 800;
  margin: 0 0 18px;
  font-size: clamp(18px, 1.8vw, 26px);
}


.panel{
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--cardShadow);
  padding: clamp(16px, 3vw, 28px);
}


.btn{
  border:0;
  background: var(--btn);
  color:#fff;
  padding: 12px 18px;
  font-weight: 900;
  border-radius: 12px;
  cursor:pointer;
  transition: .15s;
}
.btn:hover{ background: var(--btnHover); transform: translateY(-1px); }
.btn:active{ transform: translateY(1px); }


footer{
  background:#fde2e4;
  border-top: 3px solid #fdbac3;
  text-align:center;
  padding: 14px;
  color: rgba(0,0,0,.6);
  font-size: 0.9rem;
}


@media (max-width: 820px){
  .topbar{ height:auto; padding: 14px 0; position: sticky; }
  .nav-wrap{ flex-wrap:wrap; justify-content:center; }
  .nav{ justify-content:center; }
  main{ width: min(var(--max), calc(100% - 28px)); }

  .brand{ width:100%; display:flex; justify-content:center; text-align:center; }
  .nav{ width:100%; justify-content:center; gap:14px; font-size:20px; }
}


.progress-wrap{ max-width: 760px; margin: 0 auto; text-align:center; }
.level-box{
  font-family:"Baloo 2", cursive;
  font-size: 26px;
  font-weight: 900;
  color: #6a4c93;
  margin-bottom: 12px;
}
.bar-wrap{
  background:#f1f1f1;
  border-radius:999px;
  overflow:hidden;
  height:16px;
  margin-bottom: 18px;
}
.bar-fill{
  height:100%;
  width:0%;
  background: var(--btn);
  transition: width .3s;
}

</style>

</head>
<body>

<header class="topbar">
  <div class="nav-wrap">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h8l-1 8 11-14h-8l0-6Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
      CandySpark
    </div>

    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="puzzle.html">Play</a>
      <a href="quiz.html">Quiz</a>
      <a href="progress.html">Progress</a>
      <a href="about.html">About</a>
      
    </nav>
  </div>
</header>
<main>
  <h1 class="page-title">Your Progress</h1>
  <p class="page-subtitle">See your level and XP growth</p>

  <div class="panel progress-wrap">
    <div class="level-box" id="levelText"></div>
    <div class="bar-wrap"><div class="bar-fill" id="progressBar"></div></div>
    <button class="btn" onclick="location.href='index.html'">🏠 Back Home</button>
  </div>
</main>

<footer>© 2025 CandySpark — Created by Shahad Alqallaf | Supervised by Dr. Kirsty McKay</footer>
<script>
function renderProgress(){
  const xp = localStorage.getItem("candyXP") ? parseInt(localStorage.getItem("candyXP")) : 0;
  const level = Math.floor(xp/50)+1;
  const current = xp % 50;
  document.getElementById("levelText").innerText = "Level " + level + " | Total XP: " + xp;
  document.getElementById("progressBar").style.width = (current/50)*100 + "%";
}
renderProgress();
</script>
</body>
</html>
