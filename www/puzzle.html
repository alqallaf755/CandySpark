<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circuit Puzzles ⚡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#f6a9b6;
  --cream:#f7eddc;
  --brown:#8b4a2f;
  --green:#1f6b57;
  --text:#2f2f2f;
  --muted:#4b4b4b;

  --card:#ffffff;
  --cardShadow: 0 10px 24px rgba(0,0,0,.12);
  --radius:18px;

  --btn:#f4a261;
  --btnHover:#e76f51;

  --max: 1200px;
}

*{ box-sizing:border-box; }
html, body{ height:100%; }
body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height:100svh;
  display:flex;
  flex-direction:column;
}


.topbar{
  background: var(--pink);
  height: 78px;
  display:flex;
  align-items:center;
  position: sticky;
  top:0;
  z-index: 50;
  box-shadow: 0 2px 0 rgba(0,0,0,.05);
}
.nav-wrap{
  width: min(var(--max), calc(100% - 56px));
  margin: 0 auto;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family: "Baloo 2", cursive;
  font-weight:800;
  font-size: 28px;
  color:#fff;
  white-space:nowrap;
  user-select:none;
}
.logo{
  width: 34px;
  height: 34px;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 8px;
  display:grid;
  place-items:center;
}
.nav{
  display:flex;
  align-items:center;
  gap: 26px;
  font-family: "Baloo 2", cursive;
  font-size: 26px;
  color: rgba(255,255,255,.92);
  white-space:nowrap;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.nav a{
  color: inherit;
  text-decoration:none;
  opacity:.95;
  transition: opacity .15s ease, transform .08s ease;
}
.nav a:hover{ opacity:1; transform: translateY(-1px); }


main{
  width: min(var(--max), calc(100% - 56px));
  margin: 18px auto 34px;
  flex: 1;
}


.page-title{
  font-family: "Baloo 2", cursive;
  color: var(--brown);
  font-weight: 800;
  line-height: 1;
  margin: 0 0 8px;
  font-size: clamp(34px, 3.3vw, 54px);
}
.page-subtitle{
  font-family: "Baloo 2", cursive;
  color: var(--green);
  font-weight: 800;
  margin: 0 0 18px;
  font-size: clamp(18px, 1.8vw, 26px);
}


.panel{
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--cardShadow);
  padding: clamp(16px, 3vw, 28px);
}

.container{
  width: min(980px, calc(100% - 0px));
  margin: 0 auto;
}

.topbar2{
  display:flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.topbar-left h2{
  margin:0;
  font-family:"Baloo 2", cursive;
  font-size: 24px;
  font-weight: 900;
  color: var(--green);
}
.xp-display{
  margin-top: 6px;
  font-weight: 900;
  color: #6a4c93;
}

.actions-right{
  display:flex;
  align-items:center;
  gap: 8px;
  flex-wrap: wrap;
}
.nav-btn{
  background: var(--btn);
  border: none;
  color:white;
  font-weight: 900;
  padding: 10px 16px;
  border-radius: 12px;
  cursor:pointer;
  transition: .15s;
}
.nav-btn:hover{ background: var(--btnHover); }
.nav-btn:disabled{ opacity: .45; cursor:not-allowed; }

.back-link{
  background: none;
  border:none;
  color: var(--green);
  cursor:pointer;
  font-weight: 900;
  text-decoration: underline;
  padding: 10px 8px;
  font-family:"Baloo 2", cursive;
}

.puzzle-box{
  background: #fff7e6;
  border: 1px solid #f2e2c8;
  border-radius: 16px;
  padding: clamp(14px, 3vw, 22px);
  display:flex;
  flex-direction:column;
}
.puzzle-box p{
  margin: 0 0 10px;
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
}
.puzzle-box .hint{
  margin-top: 6px;
  font-size: 14px;
  font-weight: 700;
  color: #5a5a5a;
}

.slots{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin: 14px 0 18px;
}
.slot{
  min-height: 96px;
  background: #fff;
  border-radius: 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  font-weight: 900;
  transition: .15s;
  padding: 10px;
  user-select:none;
  border: 1px solid rgba(0,0,0,.06);
  flex-direction: column;
  gap: 6px;
}
.slot:hover{ background:#ffeaa7; }
.slot.filled{ background:#f1f7ff; }
.slot.selected{ outline: 3px solid var(--btn); }


.components{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.component{
  background:#fff;
  padding: 12px 14px;
  border-radius: 12px;
  cursor:pointer;
  font-weight: 900;
  transition: .15s;
  text-align:center;
  user-select:none;
  border: 1px solid rgba(0,0,0,.06);
}
.component:hover{ background:#ffeaa7; }
.component img{
  width:64px;
  height:64px;
  object-fit: contain;
  display:block;
  margin: 0 auto 6px;
  pointer-events:none; 
}

.btn-row{
  margin-top: 10px;
  display:flex;
  gap: 10px;
  flex-wrap: wrap;
}
button.action{
  background: var(--btn);
  color:white;
  font-weight: 900;
  border:none;
  padding: 12px 18px;
  border-radius: 12px;
  cursor:pointer;
  transition:.15s;
}
button.action:hover{ background: var(--btnHover); }

.message{ margin-top: 12px; font-weight: 900; font-size: 16px; }
.correct{ color:#1b8a3a; }
.wrong{ color:#c1121f; }

.score-screen{
  text-align:center;
  font-size: 1.1rem;
  margin-top: 10px;
  font-weight: 900;
}
.menu-btn{
  margin-top: 18px;
  background: var(--btn);
  color:white;
  font-weight: 900;
  border:none;
  padding: 14px 26px;
  border-radius: 12px;
  cursor:pointer;
}
.menu-btn:hover{ background: var(--btnHover); }

@media (max-width: 520px){
  .actions-right{ width:100%; }
  .nav-btn{ flex:1; }
  .back-link{ width:100%; text-align:center; }
}

@media (max-width: 820px){
  .topbar{ height:auto; padding: 14px 0; }
  .nav-wrap{ flex-wrap:wrap; justify-content:center; width: min(var(--max), calc(100% - 28px)); }
  .brand{ width:100%; display:flex; justify-content:center; text-align:center; }
  .nav{ width:100%; justify-content:center; gap:14px; font-size:20px; }
  main{ width: min(var(--max), calc(100% - 28px)); }
}
</style>
</head>

<main>

        <button class="nav-btn" id="prevBtn" onclick="prevPuzzle()">⬅ Prev</button>
        <button class="nav-btn" id="nextBtn" onclick="nextPuzzle()">Next ➡</button>
        <button class="back-link" onclick="goBack()">Back to main</button>

    <div class="puzzle-box" id="puzzleBox"></div>
    <div class="message" id="message"></div>
  </div>
</main>

<footer>© 2025 CandySpark — Created by Shahad Alqallaf | Supervised by Dr. Kirsty McKay</footer>

<script>

let xp = localStorage.getItem("candyXP") ? parseInt(localStorage.getItem("candyXP")) : 0;

function updateXPUI(){
  const level = Math.floor(xp / 50) + 1;
  document.getElementById("xpDisplay").innerText = `⭐ Level ${level} | XP: ${xp}`;
  localStorage.setItem("candyXP", xp);
}


const IMG = {

  "Resistor": "images/resistor.png",
  "LED": "images/led.png",
  "Buzzer": "images/buzzer.png",
  "Capacitor": "images/capacitor.png",
  "Lamp": "images/lamp.png",
  "Motor": "images/motor.png",
  "Potentiometer": "images/potentiometer.png"
};


const puzzles = [

//WHAT IS ELECTRICITY (1–10)

{

description:"Create a simple circuit",
order:["Battery","LED"],
components:["Battery","LED","Switch","Motor"]
},

description:"Use switch to control flow",
order:["Battery","Switch","LED"],

{

order:["Battery","Switch","LED"],

},

title:"Circuits 2: Series circuit",
order:["Battery","Resistor","LED","Motor"],
components:["Battery","Resistor","LED","Motor"]
},

title:"Circuits 3: Motor control",

},

title:"Circuits 4: LED protection",

{

},

{

let currentPuzzle = 0;
let selectedSlot = null;
let correctCount = 0;

const puzzleBox = document.getElementById("puzzleBox");
const message = document.getElementById("message");
const puzzleTitle = document.getElementById("puzzleTitle");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const container = document.getElementById("container");

const XP_PER_PUZZLE = 20;

function componentCard(name){
  const src = IMG[name] || "";
  const safeSrc = src ? src : "images/placeholder.png"; 
  return `
    <div class="component" data-name="${name}">
      <img src="${safeSrc}" alt="${name}">
      <div>${name}</div>
    </div>
  `;
}

function slotFillHTML(name){
  const src = IMG[name] || "images/placeholder.png";
  return `
    <img src="${src}" alt="${name}" style="width:52px;height:52px;object-fit:contain;pointer-events:none;">
    <div style="font-weight:900;">${name}</div>
  `;
}

function renderPuzzle() {
  const p = puzzles[currentPuzzle];

  puzzleTitle.textContent = `Puzzle ${currentPuzzle + 1} / ${puzzles.length}`;
  prevBtn.disabled = currentPuzzle === 0;
  nextBtn.textContent = currentPuzzle === puzzles.length - 1 ? "Submit" : "Next ➡";

  let html = `
    <p><strong>${p.title}</strong></p>
    <p>${p.description}</p>
    <p class="hint">Click a slot, then click a component to place it.</p>
    <div class="slots">
  `;

  for (let i = 0; i < p.order.length; i++) {
    html += `<div class="slot" data-index="${i}" data-name=""><div>${i+1}</div></div>`;
  }

  html += `</div><p><strong>Components</strong></p><div class="components">`;
  p.components.forEach(name => { html += componentCard(name); });
  html += `</div>
    <div class="btn-row">
      <button class="action" onclick="checkCircuit()">Check ✅</button>
      <button class="action" onclick="resetPuzzle()">Reset ♻</button>
    </div>
  `;

  puzzleBox.innerHTML = html;

  message.textContent = "";
  message.className = "message";

  document.querySelectorAll(".slot").forEach(slot => {
    slot.addEventListener("click", () => {
      selectedSlot = slot;
      document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
      slot.classList.add("selected");
    });
  });

  document.querySelectorAll(".component").forEach(comp => {
    comp.addEventListener("click", () => {
      if (!selectedSlot) return;

      const name = comp.getAttribute("data-name");
      selectedSlot.innerHTML = slotFillHTML(name);
      selectedSlot.dataset.name = name;

      selectedSlot.classList.add("filled");
      selectedSlot.classList.remove("selected");
      selectedSlot = null;
    });
  });
}

function checkCircuit() {
  const p = puzzles[currentPuzzle];
  const target = p.order;
  const slots = document.querySelectorAll(".slot");
  const userOrder = Array.from(slots).map(s => (s.dataset.name || "").trim());

  const notFilled = userOrder.some(v => !v);
  if (notFilled) {
    message.textContent = "Fill all slots first.";
    message.className = "message wrong";
    return;
  }

  const correct = userOrder.every((v, i) => v === target[i]);

  if (correct) {
    message.className = "message correct";

    if (!puzzles[currentPuzzle].solved) {
      puzzles[currentPuzzle].solved = true;

      xp += XP_PER_PUZZLE;
      updateXPUI();

      message.textContent = `✅ Correct! +${XP_PER_PUZZLE} XP`;
    } else {
      message.textContent = "✅ Correct! (Already rewarded)";
    }

  } else {
    message.textContent = "❌ Wrong. Correct: " + target.join(" → ");
    message.className = "message wrong";
    puzzles[currentPuzzle].solved = false;
  }
}

function resetPuzzle() {
  const p = puzzles[currentPuzzle];
  document.querySelectorAll(".slot").forEach((s, i) => {
    s.innerHTML = `<div>${i + 1}</div>`;
    s.dataset.name = "";
    s.classList.remove("filled", "selected");
  });
  selectedSlot = null;
  message.textContent = "";
  message.className = "message";
  p.solved = false;
}

function nextPuzzle() {
  if (currentPuzzle === puzzles.length - 1) {
    showScore();
  } else {
    currentPuzzle++;
    renderPuzzle();
  }
}

function prevPuzzle() {
  if (currentPuzzle > 0) {
    currentPuzzle--;
    renderPuzzle();
  }
}

function showScore() {
  correctCount = puzzles.filter(p => p.solved).length;

  container.innerHTML = `
    <div class="score-screen">
      <p>🎉 Finished Puzzles!</p>
      <p>You got <span style="color:#0077b6">${correctCount}</span> / ${puzzles.length} correct.</p>
      <p style="margin-top:10px; font-size:1.05rem; font-weight:800; color:#6a4c93;">
        Total XP: ${xp}
      </p>
      <button class="menu-btn" onclick="goBack()">Go to Main Menu</button>
    </div>
  `;
}

function goBack() {
  window.location.href = "index.html";
}

updateXPUI();
renderPuzzle();
</script>
