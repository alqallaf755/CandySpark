<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circuits ⚡ | CandySpark</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --pink:#f6a9b6;
  --cream:#f7eddc;
  --brown:#8b4a2f;
  --green:#1f6b57;
  --text:#2f2f2f;

  --card:#ffffff;
  --cardShadow: 0 10px 24px rgba(0,0,0,.12);
  --btn:#f4a261;
  --btnHover:#e76f51;
  --max: 1200px;
}

*{ box-sizing:border-box; }
html, body{ height:100%; }

body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height:100svh;
  display:flex;
  flex-direction:column;
}


.topbar{
  background: var(--pink);
  height: 78px;
  display:flex;
  align-items:center;
  position: sticky;
  top:0;
  z-index: 50;
  box-shadow: 0 2px 0 rgba(0,0,0,.05);
}
.nav-wrap{
  width: min(var(--max), calc(100% - 56px));
  margin: 0 auto;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family: "Baloo 2", cursive;
  font-weight:800;
  font-size: 28px;
  color:#fff;
  white-space:nowrap;
  user-select:none;
}
.logo{
  width: 34px;
  height: 34px;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 8px;
  display:grid;
  place-items:center;
}
.nav{
  display:flex;
  align-items:center;
  gap: 26px;
  font-family: "Baloo 2", cursive;
  font-size: 26px;
  color: rgba(255,255,255,.92);
  white-space:nowrap;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.nav a{
  color: inherit;
  text-decoration:none;
  opacity:.95;
  transition: opacity .15s ease, transform .08s ease;
}
.nav a:hover{ opacity:1; transform: translateY(-1px); }


main{
  width: min(var(--max), calc(100% - 56px));
  margin: 18px auto 34px;
  flex: 1;
}

.page-title{
  font-family: "Baloo 2", cursive;
  color: var(--brown);
  font-weight: 800;
  line-height: 1;
  margin: 0 0 8px;
  font-size: clamp(34px, 3.3vw, 54px);
}
.page-subtitle{
  font-family: "Baloo 2", cursive;
  color: var(--green);
  font-weight: 800;
  margin: 0 0 18px;
  font-size: clamp(18px, 1.8vw, 26px);
}

.panel{
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--cardShadow);
  padding: clamp(16px, 3vw, 28px);
  width: min(980px, 100%);
  margin: 0 auto;
}

.video-wrap{
  background: #fff7e6;
  border: 1px solid #f2e2c8;
  border-radius: 16px;
  padding: 14px;
}

video{
  width:100%;
  border-radius: 14px;
  display:block;
}

.text-box{
  margin-top: 16px;
  background: #ffffff;
  border: 1px solid rgba(0,0,0,.06);
  border-radius: 16px;
  padding: 16px;
}

.text-box h3{
  margin: 0 0 8px;
  font-family: "Baloo 2", cursive;
  color: var(--green);
  font-size: 24px;
}

.text-box p{
  margin: 0 0 10px;
  line-height: 1.65;
  font-weight: 600;
}

.back-row{
  margin-top: 16px;
  display:flex;
  justify-content:flex-end;
  gap: 10px;
  flex-wrap: wrap;
}

.btn{
  border:0;
  background: var(--btn);
  color:#fff;
  padding: 12px 18px;
  font-weight: 900;
  border-radius: 12px;
  cursor:pointer;
  transition: .15s;
}
.btn:hover{ background: var(--btnHover); transform: translateY(-1px); }
.btn:active{ transform: translateY(1px); }


footer{
  background:#fde2e4;
  border-top: 3px solid #fdbac3;
  text-align:center;
  padding: 14px;
  color: rgba(0,0,0,.6);
  font-size: 0.9rem;
}


@media (max-width: 820px){
  .topbar{ height:auto; padding: 14px 0; }
  .nav-wrap{ flex-wrap:wrap; justify-content:center; }
  .nav{ justify-content:center; }
  main{ width: min(var(--max), calc(100% - 28px)); }

  .brand{ width:100%; display:flex; justify-content:center; text-align:center; }
  .nav{ width:100%; justify-content:center; gap:14px; font-size:20px; }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="nav-wrap">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h8l-1 8 11-14h-8l0-6Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
      CandySpark
    </div>

    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="puzzle.html">Play</a>
      <a href="quiz.html">Quiz</a>
      <a href="progress.html">Progress</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main>
  <h1 class="page-title">Circuits</h1>
  <p class="page-subtitle">Five short lessons with videos</p>

  <div class="panel">
    <div class="video-wrap">
      <video id="lessonVideo" controls></video>
    </div>

    <div class="text-box">
      <h3 id="lessonTitle"></h3>
      <p id="lessonText"></p>
    </div>

    <div class="back-row">
      <button class="btn" type="button" onclick="prevLesson()">← Previous Lesson</button>
      <button class="btn" type="button" onclick="nextLesson()">Next Lesson →</button>
      <button class="btn" type="button" onclick="window.location.href='learn.html'">Back to Learn</button>
    </div>
  </div>
</main>

<footer>© 2025 CandySpark — Created by Shahad Alqallaf | Supervised by Dr. Kirsty McKay</footer>

<script>
const lessons = [
  { title:"What is a circuit?",        video:"videos/circuits1.mp4",    text:"A circuit is a path that electricity follows from the battery, through components, and back to the battery." },
  { title:"Complete vs incomplete circuit",           video:"videos/circuits2.mp4",    text:"A complete circuit allows electricity to flow. An incomplete circuit stops electricity." },
  { title:"Circuit diagram",             video:"videos/circuits3.mp4",    text:"Circuit diagrams help us understand how components connect." },
  { title:"Switch control",           video:"videos/circuits4.mp4",    text:"A switch controls the circuit. ON closes the path and OFF opens the path." },
  { title:"Series circuit example",   video:"videos/circuits5.mp4",    text:"In a series circuit, components share one path and current flows through them in order." }
];

let currentLesson = 0;

function renderLesson(){
  const lesson = lessons[currentLesson];

  const video = document.getElementById("lessonVideo");
  const title = document.getElementById("lessonTitle");
  const text  = document.getElementById("lessonText");

  if(!video || !title || !text) return;

  title.textContent = lesson.title;
  text.textContent  = lesson.text;

  video.pause();
  video.src = lesson.video;
  video.load();
}

function nextLesson(){
  currentLesson = (currentLesson + 1) % lessons.length;
  renderLesson();
}

function prevLesson(){
  currentLesson = (currentLesson - 1 + lessons.length) % lessons.length;
  renderLesson();
}

document.addEventListener("DOMContentLoaded", renderLesson);
</script>

</body>
</html>
