<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CandySpark Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --pink:#f6a9b6;
  --cream:#f7eddc;
  --brown:#8b4a2f;
  --green:#1f6b57;
  --text:#2f2f2f;
  --muted:#4b4b4b;

  --card:#ffffff;
  --cardShadow: 0 10px 24px rgba(0,0,0,.12);
  --radius:18px;

  --btn:#f4a261;
  --btnHover:#e76f51;

  --max: 1200px;
}

*{ box-sizing:border-box; }
html, body{ height:100%; }
body{
  margin:0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

.topbar{
  background: var(--pink);
  height: 78px;
  display:flex;
  align-items:center;
  position: sticky;
  top:0;
  z-index: 50;
  box-shadow: 0 2px 0 rgba(0,0,0,.05);
}
.nav-wrap{
  width: min(var(--max), calc(100% - 56px));
  margin: 0 auto;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family: "Baloo 2", cursive;
  font-weight:800;
  font-size: 28px;
  color:#fff;
  white-space:nowrap;
  user-select:none;
}
.logo{
  width: 34px;
  height: 34px;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 8px;
  display:grid;
  place-items:center;
}
.nav{
  display:flex;
  align-items:center;
  gap: 26px;
  font-family: "Baloo 2", cursive;
  font-size: 26px;
  color: rgba(255,255,255,.92);
  white-space:nowrap;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.nav a{
  color: inherit;
  text-decoration:none;
  opacity:.95;
  transition: opacity .15s ease, transform .08s ease;
}
.nav a:hover{ opacity:1; transform: translateY(-1px); }
.nav .btn-link{
  border:0;
  padding: 8px 12px;
  border-radius: 10px;
  cursor:pointer;
  font-weight:800;
  background: rgba(255,255,255,.92);
  color: #e85d75;
  font-family: "Baloo 2", cursive;
  font-size: 18px;
}

main{
  width: min(var(--max), calc(100% - 56px));
  margin: 18px auto 34px;
  flex: 1;
}

.page-title{
  font-family: "Baloo 2", cursive;
  color: var(--brown);
  font-weight: 800;
  line-height: 1;
  margin: 0 0 8px;
  font-size: clamp(34px, 3.3vw, 54px);
}
.page-subtitle{
  font-family: "Baloo 2", cursive;
  color: var(--green);
  font-weight: 800;
  margin: 0 0 18px;
  font-size: clamp(18px, 1.8vw, 26px);
}

.panel{
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--cardShadow);
  padding: clamp(16px, 3vw, 28px);
}

.btn{
  border:0;
  background: var(--btn);
  color:#fff;
  padding: 12px 18px;
  font-weight: 900;
  border-radius: 12px;
  cursor:pointer;
  transition: .15s;
}
.btn:hover{ background: var(--btnHover); transform: translateY(-1px); }
.btn:active{ transform: translateY(1px); }

footer{
  background:#fde2e4;
  border-top: 3px solid #fdbac3;
  text-align:center;
  padding: 14px;
  color: rgba(0,0,0,.6);
  font-size: 0.9rem;
}

@media (max-width: 820px){
  .topbar{ height:auto; padding: 14px 0; position: sticky; }
  .nav-wrap{ flex-wrap:wrap; justify-content:center; }
  .nav{ justify-content:center; }
  main{ width: min(var(--max), calc(100% - 28px)); }

  .brand{ width:100%; display:flex; justify-content:center; text-align:center; }
  .nav{ width:100%; justify-content:center; gap:14px; font-size:20px; }
}

.quiz-container{ max-width: 900px; margin: 0 auto; }
.progress{ height: 12px; width: 100%; background: #f1f1f1; border-radius: 10px; margin-bottom: 18px; overflow:hidden; }
.progress-fill{ height: 100%; width:0%; background: var(--btn); transition: width .3s; }
#levelTitle{
  text-align:center;
  font-family:"Baloo 2", cursive;
  font-size: 24px;
  font-weight: 800;
  color: var(--green);
  margin: 6px 0 10px;
}
#xpBox{
  text-align:center;
  margin-bottom: 18px;
  font-weight: 700;
  color: #6a4c93;
}
.xp-wrap{
  max-width: 520px;
  margin: 8px auto 0;
  background: #f1f1f1;
  border-radius: 999px;
  overflow:hidden;
  height: 12px;
}
.xp-fill{ height:100%; width:0%; background:#6a4c93; transition: width .3s; }

.question-box{
  background: #fff7e6;
  border: 1px solid #f2e2c8;
  padding: 22px;
  border-radius: 16px;
}
.question-box p{
  font-size: 18px;
  font-weight: 700;
  margin-top: 0;
}
.option{
  background: #fff;
  padding: 12px 14px;
  margin: 8px 0;
  border-radius: 12px;
  cursor:pointer;
  transition: .2s;
  border: 1px solid rgba(0,0,0,.06);
  font-weight: 700;
}
.option:hover{ background: #ffeaa7; }
.option.correct{ background:#c1fba4; font-weight: 800; }
.option.wrong{ background:#ffc8dd; font-weight: 800; }
.option.disabled{ pointer-events:none; opacity:.9; }

.results{
  text-align:center;
  font-size: 1.15rem;
  font-weight: 700;
}
.menu-btn{
  margin-top: 15px;
  background: var(--btn);
  color:white;
  border:none;
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 1rem;
  cursor:pointer;
  font-weight: 900;
}
.menu-btn:hover{ background: var(--btnHover); }
.home-btn{ background:#6a4c93; }
.home-btn:hover{ background:#53367a; }


.modal-backdrop{
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(246,169,182,.55); 
  z-index: 999;
}
.modal-backdrop.show{ display:flex; }

.modal-card{
  width: min(560px, 100%);
  background: var(--card);
  border-radius: 18px;
  box-shadow: 0 18px 50px rgba(0,0,0,.18);
  border: 2px solid rgba(232,93,117,.18);
  overflow: hidden;
}
.modal-head{
  background: #fde2e4;
  padding: 14px 16px;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 12px;
}
.modal-title{
  margin:0;
  font-family:"Baloo 2", cursive;
  font-size: 22px;
  font-weight: 800;
  color: #b23a48;
}
.modal-close{
  border:0;
  background: rgba(255,255,255,.9);
  color: #b23a48;
  font-weight: 900;
  border-radius: 10px;
  padding: 8px 12px;
  cursor:pointer;
}
.modal-body{
  padding: 16px;
  color: var(--text);
}
.modal-body .ans{
  background: #fff7e6;
  border: 1px solid #f2e2c8;
  padding: 12px 14px;
  border-radius: 14px;
  font-weight: 800;
  margin-bottom: 10px;
}
.modal-body .exp{
  background: #eef7f4;
  border: 1px solid rgba(31,107,87,.18);
  padding: 12px 14px;
  border-radius: 14px;
  color: #185346;
  font-weight: 700;
}
.modal-actions{
  display:flex;
  gap: 10px;
  padding: 14px 16px 16px;
  flex-wrap: wrap;
}
.modal-actions .menu-btn{
  margin-top: 0;
  flex: 1;
  min-width: 180px;
}
.modal-actions .learn-btn{
  background: #1f6b57;
}
.modal-actions .learn-btn:hover{
  background: #165242;
}
</style>

</head>
<body>

<header class="topbar">
  <div class="nav-wrap">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14h8l-1 8 11-14h-8l0-6Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
      CandySpark
    </div>

    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="puzzle.html">Play</a>
      <a href="quiz.html">Quiz</a>
      <a href="progress.html">Progress</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main>
  <h1 class="page-title">CandySpark Quiz</h1>
  <p class="page-subtitle">Test your knowledge and earn XP</p>

  <div class="panel quiz-container">
    <div class="progress"><div class="progress-fill" id="progressBar"></div></div>

    <div id="levelTitle"></div>

    <div id="xpBox">
      <div id="xpText"></div>
      <div class="xp-wrap"><div class="xp-fill" id="xpBar"></div></div>
    </div>

    <div id="quizArea"></div>
    <div id="results" class="results"></div>
  </div>
</main>

<footer>© 2025 CandySpark — Created by Shahad Alqallaf | Supervised by Dr. Kirsty McKay</footer>



<div class="modal-backdrop" id="wrongModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="wrongTitle">
    <div class="modal-head">
      <h2 class="modal-title" id="wrongTitle">❌ Wrong Answer</h2>
      <button class="modal-close" id="wrongCloseBtn" type="button">Close</button>
    </div>
    <div class="modal-body">
      <div class="ans" id="wrongAnswerText"></div>
      <div class="exp" id="wrongExplainText"></div>
    </div>
    <div class="modal-actions">
      <button class="menu-btn learn-btn" id="goLearnBtn" type="button">📚 Back to Learn</button>
      <button class="menu-btn" id="continueBtn" type="button">Continue Quiz ➡️</button>
    </div>
  </div>
</div>

<script>
const questions = [

//WHAT IS ELECTRICITY (1–10)

{
q:"What is electricity?",
options:["Flow of electrons","Flow of water","Flow of air","Flow of heat"],
correct:0
},

{
q:"What powers a circuit?",
options:["Battery","Wood","Plastic","Rubber"],
correct:0
},

{
q:"What does electricity need to flow?",
options:["Closed circuit","Open circuit","Broken wire","Air"],
correct:0
},

{
q:"What is the energy source?",
options:["Battery","Switch","LED","Wire"],
correct:0
},

{
q:"What happens in an open circuit?",
options:["No current flows","Current flows","Motor spins","LED lights"],
correct:0
},

{
q:"Electricity moves through:",
options:["Wires","Wood","Plastic","Glass"],
correct:0
},

{
q:"What produces electrical energy?",
options:["Battery","Motor","LED","Resistor"],
correct:0
},

{
q:"What carries electricity?",
options:["Electrons","Protons","Neutrons","Atoms"],
correct:0
},

{
q:"Electric current needs:",
options:["Complete path","Broken path","Switch off","Plastic"],
correct:0
},

{
q:"Electricity is a form of:",
options:["Energy","Water","Air","Light"],
correct:0
},

//CIRCUITS (11–20)

{
q:"What is a closed circuit?",
options:["Complete path","Broken path","No wire","No battery"],
correct:0
},

{
q:"What controls current?",
options:["Switch","Battery","Wire","Motor"],
correct:0
},

{
q:"What lights up in a circuit?",
options:["LED","Wire","Battery","Switch"],
correct:0
},

{
q:"What protects LED?",
options:["Resistor","Battery","Wire","Motor"],
correct:0
},

{
q:"What converts electrical energy to motion?",
options:["Motor","LED","Resistor","Wire"],
correct:0
},

{
q:"What stores energy?",
options:["Capacitor","Motor","LED","Wire"],
correct:0
},

{
q:"Series circuit has:",
options:["One path","Two paths","Three paths","No path"],
correct:0
},

{
q:"Parallel circuit has:",
options:["Multiple paths","One path","No path","Broken path"],
correct:0
},

{
q:"Circuit needs:",
options:["Power source","Plastic","Wood","Air"],
correct:0
},

{
q:"Circuit must be:",
options:["Closed","Open","Broken","Plastic"],
correct:0
},

//CONDUCTORS (21–30)

{
q:"What is a conductor?",
options:["Allows electricity","Blocks electricity","Stores electricity","Stops circuit"],
correct:0
},

{
q:"Example of conductor?",
options:["Copper","Plastic","Wood","Rubber"],
correct:0
},

{
q:"Metal is:",
options:["Good conductor","Bad conductor","Insulator","Blocker"],
correct:0
},

{
q:"Wire is made of:",
options:["Metal","Wood","Plastic","Glass"],
correct:0
},

{
q:"What allows current flow?",
options:["Conductor","Insulator","Plastic","Wood"],
correct:0
},

{
q:"Which is NOT conductor?",
options:["Plastic","Copper","Gold","Silver"],
correct:0
},

{
q:"Electricity flows easily in:",
options:["Metal","Plastic","Wood","Rubber"],
correct:0
},

{
q:"Best conductor?",
options:["Copper","Wood","Plastic","Rubber"],
correct:0
},

{
q:"Wire helps:",
options:["Carry current","Stop current","Block current","Store current"],
correct:0
},

{
q:"Conductors allow:",
options:["Current flow","No flow","Stop motor","Break circuit"],
correct:0
},

//SAFETY (31–40)

{
q:"What protects LED?",
options:["Resistor","Battery","Wire","Motor"],
correct:0
},

{
q:"What prevents too much current?",
options:["Resistor","Switch","Wire","Battery"],
correct:0
},

{
q:"What controls circuit safely?",
options:["Switch","Battery","Motor","LED"],
correct:0
},

{
q:"What reduces current?",
options:["Resistor","Motor","Battery","Wire"],
correct:0
},

{
q:"Safety prevents:",
options:["Damage","Power","Light","Motion"],
correct:0
},

{
q:"Too much current causes:",
options:["Damage","Safety","Protection","Energy"],
correct:0
},

{
q:"Safe circuit uses:",
options:["Resistor","Plastic","Wood","Glass"],
correct:0
},

{
q:"Switch helps:",
options:["Control current","Increase danger","Break battery","Destroy LED"],
correct:0
},

{
q:"Resistor protects:",
options:["LED","Battery","Wire","Switch"],
correct:0
},

{
q:"Safety keeps circuit:",
options:["Protected","Broken","Open","Off"],
correct:0
},

];

// shuffle
function shuffleArray(array){
  for(let i = array.length - 1; i > 0; i--){
    const randomIndex = Math.floor(Math.random() * (i + 1));
    [array[i], array[randomIndex]] = [array[randomIndex], array[i]];
  }
  return array;
}

function shuffleQuestionOptions(question){
  const correctAnswerText = question.options[question.correct];
  const shuffledOptions = [...question.options];
  shuffleArray(shuffledOptions);
  question.options = shuffledOptions;
  question.correct = shuffledOptions.indexOf(correctAnswerText);
}

questions.forEach(function(question){
  shuffleQuestionOptions(question);
});

let currentIndex=0,score=0;
let xp = localStorage.getItem("candyXP") ? parseInt(localStorage.getItem("candyXP")) : 0;

const perLevel=5,totalLevels=8;
const quizArea=document.getElementById("quizArea");
const results=document.getElementById("results");
const progress=document.getElementById("progressBar");
const levelTitle=document.getElementById("levelTitle");
const xpBar=document.getElementById("xpBar");
const xpText=document.getElementById("xpText");

// Modal wiring 
const wrongModal = document.getElementById("wrongModal");
const wrongAnswerText = document.getElementById("wrongAnswerText");
const wrongExplainText = document.getElementById("wrongExplainText");
const goLearnBtn = document.getElementById("goLearnBtn");
const continueBtn = document.getElementById("continueBtn");
const wrongCloseBtn = document.getElementById("wrongCloseBtn");

let pendingAdvance = null;

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[s]));
}

function makeSimpleExplain(questionText, correctText){
  return `Correct answer: "${correctText}". This matches the basic rule for this topic in simple circuits.`;
}

function openWrongModal(correctText, explainText){
  wrongAnswerText.innerHTML = `✅ Answer: ${escapeHTML(correctText)}`;
  wrongExplainText.innerHTML = `💡 Explanation: ${escapeHTML(explainText)}`;
  wrongModal.classList.add("show");
  wrongModal.setAttribute("aria-hidden","false");
}

function closeWrongModal(){
  wrongModal.classList.remove("show");
  wrongModal.setAttribute("aria-hidden","true");
}

// continue after worng
function continueAfterWrong(){
  closeWrongModal();
  if(typeof pendingAdvance === "function"){
    const fn = pendingAdvance;
    pendingAdvance = null;
    fn();
  }
}

wrongCloseBtn.addEventListener("click", () => {
  continueAfterWrong();
});

goLearnBtn.addEventListener("click", () => {
  location.href = "learn.html";
});

continueBtn.addEventListener("click", () => {
  continueAfterWrong();
});

// continue after pop up anywhere click
wrongModal.addEventListener("click", (e) => {
  if(e.target === wrongModal){
    continueAfterWrong();
  }
});

function updateXPUI(){
  const level = Math.floor(xp / 50) + 1;
  const currentXP = xp % 50;
  xpText.innerText = `Player Level ${level} | XP: ${xp}`;
  xpBar.style.width = (currentXP/50)*100 + "%";
}

function renderQuestion(){
 const q=questions[currentIndex];
 const level=Math.floor(currentIndex/perLevel)+1;
 levelTitle.innerText=`⭐ Level ${level} / ${totalLevels}`;
 progress.style.width=(currentIndex/questions.length)*100+"%";

 let html=`<div class="question-box"><p>${q.q}</p>`;
 q.options.forEach((o,i)=>{
  html+=`<div class="option" data-i="${i}">${o}</div>`;
 });
 html+="</div>";
 quizArea.innerHTML=html;

 document.querySelectorAll(".option").forEach(o=>{
  o.onclick=()=>answer(o,q);
 });
}

function advanceFlow(){
  currentIndex++;
  if(currentIndex%perLevel===0 && currentIndex<questions.length) showLevel();
  else if(currentIndex<questions.length) renderQuestion();
  else finish();
}

function answer(el,qObj){
 document.querySelectorAll(".option").forEach(o=>o.classList.add("disabled"));
 const i=+el.dataset.i;
 const correct = qObj.correct;

 if(i===correct){
  el.classList.add("correct");
  score++;
  xp+=10;
  localStorage.setItem("candyXP", xp);
  updateXPUI();

  setTimeout(()=>{ advanceFlow(); },700);
 } else {
  el.classList.add("wrong");
  document.querySelector(`[data-i='${correct}']`).classList.add("correct");

  const correctText = qObj.options[correct];
  const explainText = qObj.explain ? qObj.explain : makeSimpleExplain(qObj.q, correctText);

  pendingAdvance = () => advanceFlow();
  openWrongModal(correctText, explainText);
 }
}

function showLevel(){
 quizArea.innerHTML=`
 <div class="results">
 🎉 Level Completed!
 <br><br>
 <button class="menu-btn" onclick="renderQuestion()">Next Level ➡️</button>
 <br>
 <button class="menu-btn home-btn" onclick="location.href='index.html'">🏠 Home</button>
 </div>`;
}

function finish(){
 progress.style.width="100%";
 quizArea.innerHTML="";
 results.innerHTML=`🎉 Finished!<br>
 Score: ${score} / ${questions.length}<br>
 Total XP: ${xp}
 <br><br>
 <button class="menu-btn home-btn" onclick="location.href='index.html'">🏠 Home</button>`;
}

updateXPUI();
renderQuestion();
</script>
</body>
</html>
