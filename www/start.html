<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - CandySpark</title>

<style>
body{
  font-family:"Poppins",sans-serif;
  margin:0;
  background:#ffeaf1;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  background:#fdbac3;
  padding:14px 30px;
  color:white;
  font-weight:700;
}

.main-title{
  text-align:center;
  margin-top:50px;
  color:#e85d75;
  font-size:2rem;
  font-weight:900;
}

.sub-title{
  text-align:center;
  color:#0077b6;
  margin-bottom:30px;
}

.form-wrapper{
  width:350px;
  margin:0 auto;
}

label{
  font-weight:700;
  color:#0077b6;
  display:block;
  margin-top:15px;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:2px solid #caf0f8;
  margin-top:6px;
}

input:focus{
  outline:none;
  border-color:#f4a261;
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#f4a261;
  color:white;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#e76f51;
}

footer{
  margin-top:auto;
  background:#fde2e4;
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<header>⚡ CandySpark</header>

<h2 class="main-title">Welcome to CandySpark</h2>
<h3 class="sub-title">Start Your Adventure</h3>

<div class="form-wrapper">
  <form id="startForm">
    <label>Your Name</label>
    <input type="text" id="name" required>

    <label>Your Age</label>
    <input type="number" id="age" min="6" max="18" required>

    <button type="submit">Start ⚡</button>
  </form>
</div>

<footer>⚡ 2025 CandySpark</footer>

<script>
if(localStorage.getItem("cs_name")){
  window.location.href = "index.html";
}

document.getElementById("startForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const age = parseInt(document.getElementById("age").value);

  if(!name || !age){
    alert("Please enter your name and age");
    return;
  }

  localStorage.setItem("cs_name", name);
  localStorage.setItem("cs_age", age);

  window.location.href = "index.html";
});
</script>

</body>
</html>
